[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberhunter-cpu"
version = "0.1.0"
description = "CyberHunter Raspberry Pi central processing components"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "BLE001", # Worker beklenmeyen donanım/IO hatalarını retry kuyruğuna taşımalıdır.
  "EXE001", # Üretim dosyası çalıştırılabilir; repo arşivinde mod bilgisi korunmayabilir.
  "FLY002", # Deterministik kimlik seed'i tuple/join biçimini bilinçli korur.
  "TRY004", # Geri kazanılmış worker hata sözleşmesindeki ValueError mesajları korunur.
]
